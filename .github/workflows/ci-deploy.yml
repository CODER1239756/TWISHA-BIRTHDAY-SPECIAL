name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed yet, so npm install resolves package ranges.
      # The generated lockfile is uploaded as an artifact for later commit.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # vite.config.ts derives the Pages base path from GITHUB_REPOSITORY.
      - name: Build
        run: npm run build

      # ---- Audit steps -------------------------------------------------
      # Fails the run if the built site would request assets from the wrong
      # place on GitHub Pages (the most common "blank page" cause).
      - name: Audit - Pages base path
        if: github.event.repository.name != format('{0}.github.io', github.repository_owner)
        run: |
          BASE="/${{ github.event.repository.name }}/"
          echo "Expecting asset URLs under $BASE"
          grep -Eo '(src|href)="[^"]*assets/[^"]*"' dist/index.html
          if grep -E '(src|href)="/assets/' dist/index.html; then
            echo "::error::Found root-relative /assets/ URLs; base path is wrong."; exit 1
          fi
          grep -q "$BASE" dist/index.html || { echo "::error::$BASE not found in dist/index.html"; exit 1; }

      # First-load budget from the plan: about 15 MB. Fails above it.
      - name: Audit - build size budget
        run: |
          du -sh dist
          find dist -type f -printf '%s %p\n' | sort -nr | head -10
          SIZE=$(du -sb dist | cut -f1)
          [ "$SIZE" -le 15728640 ] || { echo "::error::dist is over 15 MB"; exit 1; }

      # Informational: reports known vulnerabilities but does not block deploy.
      - name: Audit - dependency vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Save resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
